# Alpine's nginx package ships its own default nginx.conf, and its http-context include
# doesn't line up with the conf.d/default.conf.template convention this repo uses (that
# convention matches Debian's nginx package, which is what reportzero-infra builds on) —
# dropping a server block into conf.d/ against Alpine's stock nginx.conf fails with
# '"server" directive is not allowed here'. Shipping this file sidesteps that entirely.
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    include /etc/nginx/conf.d/*.conf;
}
